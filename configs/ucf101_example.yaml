# Example Configuration File for UCF101 Dataset
# Copy this file and update the paths to match your setup

# Dataset Configuration
dataset:
  root: "/home/user/data/ucf101"  # UPDATE THIS: Path to your UCF101 dataset
  annotation_path: "/home/user/data/ucf101/annotations"  # UPDATE THIS: Path to annotations directory
  label_path: "/home/user/data/ucf101/annotations/classInd.txt"  # UPDATE THIS: Path to classInd.txt
  num_classes: 101

# Model Configuration
model:
  num_layers: 12
  num_heads: 12
  hidden_dim: 768
  mlp_dim: 3072
  dropout: 0.0
  attention_dropout: 0.0

# Training Configuration
training:
  batch_size: 32
  frames_per_clip: 32
  video_size: [224, 224]
  max_epochs: 10
  num_workers: null  # null = auto-detect CPU count
  seed: 42
  lr: 1e-4
  weight_decay: 0.001
  label_smoothing: 0.0
  precision: "16-mixed"
  limit_val_batches: 0.5

# Data Augmentation
augmentation:
  rand_augment:
    magnitude: 10
    num_layers: 2

# Paths
paths:
  pretrained_weight: "tubevit_b_(a+iv)+(d+v)+(e+iv)+(f+v).pt"

# Metadata files
metadata:
  train_file: "ucf101-train-meta.pickle"
  val_file: "ucf101-val-meta.pickle"
