# TubeViT Configuration File for Kinetics-400 Dataset
# This file contains common configuration parameters for training and evaluation

# Dataset Configuration
dataset:
  name: "kinetics400"  # Dataset identifier
  root: "/path/to/kinetics400"  # Path to Kinetics-400 dataset root directory
  # annotation_path: NOT USED for Kinetics (directory structure is the annotation)
  # label_path: Optional - if not provided, labels will be extracted from dataset
  #   If provided, should be a text file with one class name per line
  num_classes: 400  # Number of classes in Kinetics-400

# Model Configuration
model:
  num_layers: 12
  num_heads: 12
  hidden_dim: 768
  mlp_dim: 3072
  dropout: 0.0
  attention_dropout: 0.0

# Training Configuration
training:
  batch_size: 32
  frames_per_clip: 32
  video_size: [224, 224]  # [height, width]
  max_epochs: 10
  num_workers: null  # null means auto-detect (number of CPUs)
  seed: 42
  lr: 1e-4
  weight_decay: 0.001
  label_smoothing: 0.0
  precision: "16-mixed"  # Mixed precision training
  limit_val_batches: 0.5  # Use 50% of validation set for validation

# Data Augmentation
augmentation:
  rand_augment:
    magnitude: 10
    num_layers: 2

# Paths
paths:
  pretrained_weight: "tubevit_b_(a+iv)+(d+v)+(e+iv)+(f+v).pt"  # Path to pretrained ImageNet weights

# Metadata files (will be auto-generated if not exists)
metadata:
  train_file: "kinetics400-train-meta.pickle"
  val_file: "kinetics400-val-meta.pickle"

# Note: Kinetics dataset structure should be:
# root/
#   train/
#     class1/
#       video1.mp4
#       video2.mp4
#       ...
#     class2/
#       ...
#   val/
#     class1/
#       video1.mp4
#       ...
#     class2/
#       ...
